name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Format, compile, credo, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-beam-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: ${{ runner.os }}-beam-
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: shellcheck priv/templates/scripts/*.sh
      - name: Unit tests and the fixture consumer (path dependency)
        run: mix test --include consumer
      - name: The fixture consumer as a git dependency at this commit
        run: |
          CHRIS_CHECKS_GIT_URL="$GITHUB_WORKSPACE" CHRIS_CHECKS_GIT_REF="$(git rev-parse HEAD)" \
            mix test test/consumer_test.exs --include consumer
